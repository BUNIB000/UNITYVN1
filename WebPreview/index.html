<meta charset="utf-8">
<title>Coffee &amp; Secrets</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Varela+Round&display=swap">
<style>
/* Story frame is a 9:16 phone screen, centered and letterboxed. One committed visual world (dark plum shell, bright story UI). */
:root {
  --shell: #1a1020;
  --shell-2: #2a1a33;
  --ink: #2b1d2c;
  --paper: #ffffff;
  --muted: #8a7a90;
  --accent: #ff5c8a;
  --accent-2: #ffb547;
  --good: #3cc88f;
  --bad: #ff5d5d;
  --glass: rgba(24, 14, 30, .78);
  --font-title: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif;
  --font-body: 'Varela Round', 'Nunito', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: radial-gradient(120% 80% at 50% 0%, #3a2248 0%, var(--shell) 60%) fixed, var(--shell); color: #fff; font-family: var(--font-body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#app { position: relative; height: 100%; display: grid; place-items: center; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
#frame { position: relative; overflow: hidden; background: #120c18; border-radius: 0; box-shadow: 0 20px 80px rgba(0,0,0,.6); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
@media (min-width: 520px) { #frame { border-radius: 22px; } }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.layer { position: absolute; inset: 0; pointer-events: none; }
.layer > * { pointer-events: auto; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }

/* ---------- HUD ---------- */
#hud { display: flex; justify-content: space-between; align-items: flex-start; padding: .7em .7em; inset: 0 0 auto 0; z-index: 30; }
.hud-btn { pointer-events: auto; background: rgba(20, 10, 26, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-radius: 999px; padding: .38em .8em; font-family: var(--font-title); font-size: .78em; letter-spacing: .04em; color: #fff; display: inline-flex; align-items: center; gap: .35em; }
.hud-btn.on { background: var(--accent); }
.hud-btn svg { width: 1.2em; height: 1.2em; }
.hud-right { display: flex; gap: .4em; }

/* ---------- bubbles ---------- */
.bubble { position: absolute; max-width: 82%; min-width: 34%; background: var(--paper); color: var(--ink); border-radius: 1.1em; padding: .85em 1.05em .9em; font-size: 1.02em; line-height: 1.38; box-shadow: 0 .35em 0 rgba(0,0,0,.14), 0 .8em 1.6em rgba(0,0,0,.25); transform-origin: 50% 100%; animation: pop .32s cubic-bezier(.2,1.6,.4,1) both; }
.bubble .name { position: absolute; left: .9em; top: -1.05em; font-family: var(--font-title); font-size: .92em; letter-spacing: .03em; color: #fff; padding: .18em .75em .22em; border-radius: .7em; box-shadow: 0 .2em 0 rgba(0,0,0,.18); white-space: nowrap; }
.bubble .tail { position: absolute; width: 1.3em; height: 1.1em; bottom: -.95em; background: inherit; clip-path: polygon(0 0, 100% 0, 50% 100%); }
.bubble .text { min-height: 1.38em; }
.bubble .more { position: absolute; right: .7em; bottom: .35em; width: .7em; height: .5em; background: var(--accent); clip-path: polygon(0 0, 100% 0, 50% 100%); opacity: 0; animation: nudge 1s ease-in-out infinite; }
.bubble.done .more { opacity: 1; }
.bubble.thought { background: rgba(255,255,255,.95); border-radius: 2.2em; font-style: italic; color: #5a4a62; box-shadow: 0 0 0 .25em rgba(255,255,255,.35), 0 .8em 1.6em rgba(0,0,0,.25); }
.bubble.thought .tail { display: none; }
.bubble .dots { position: absolute; bottom: -1.6em; width: 1.6em; height: 1.6em; }
.bubble .dots i { position: absolute; background: rgba(255,255,255,.95); border-radius: 50%; }
.bubble.shout { border-radius: .5em; font-family: var(--font-title); font-size: 1.15em; letter-spacing: .02em; border: .18em solid var(--ink); animation: pop .32s cubic-bezier(.2,1.6,.4,1) both, jitter .12s linear 3 .32s; }
.bubble.whisper { background: rgba(255,255,255,.88); border: .14em dashed #b9a6c4; font-size: .92em; color: #6b5a74; }
.bubble.narration { left: 7% !important; right: 7%; max-width: none; background: var(--glass); color: #fff; text-align: center; border-radius: .9em; box-shadow: 0 .8em 2em rgba(0,0,0,.35); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); transform-origin: 50% 50%; }
.bubble.narration .more { background: var(--accent-2); }
.phone { position: absolute; left: 50%; top: 14%; width: 70%; transform: translateX(-50%); background: #16121c; border-radius: 1.8em; padding: .7em .7em 1.4em; box-shadow: 0 0 0 .35em #2d2735, 0 1.4em 3em rgba(0,0,0,.5); animation: slideup .45s cubic-bezier(.2,1.3,.4,1) both; }
.phone .bar { display: flex; align-items: center; gap: .5em; padding: .5em .6em .7em; border-bottom: 1px solid #2f2838; font-family: var(--font-title); }
.phone .avatar { width: 1.9em; height: 1.9em; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: .9em; }
.phone .msg { margin: .9em .2em 0; background: #3a7bff; color: #fff; padding: .7em .9em; border-radius: 1.1em 1.1em 1.1em .3em; line-height: 1.35; min-height: 1.4em; }

/* ---------- choices ---------- */
#choices { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: .65em; padding: 0 8%; background: linear-gradient(transparent 20%, rgba(18,10,24,.45) 50%, transparent 85%); }
.prompt { font-family: var(--font-title); font-size: 1.15em; text-align: center; text-shadow: 0 .12em 0 rgba(0,0,0,.4); margin-bottom: .3em; animation: pop .3s both; }
.opt { width: 100%; background: #fff; color: var(--ink); border-radius: 999px; padding: .85em 1.1em; font-size: 1em; line-height: 1.25; display: flex; align-items: center; gap: .6em; box-shadow: 0 .3em 0 #d9c9df, 0 .7em 1.2em rgba(0,0,0,.28); animation: pop .34s cubic-bezier(.2,1.6,.4,1) both; text-align: left; transition: transform .12s; }
.opt:active { transform: scale(.96); }
.opt .ic { width: 1.5em; height: 1.5em; flex: none; color: var(--accent); }
.opt.locked { background: #d8d0dc; color: #7b6f80; box-shadow: 0 .3em 0 #b6aabb; }
.opt.locked .ic { color: #7b6f80; }
.opt.chosen { background: var(--accent); color: #fff; box-shadow: 0 .3em 0 #c43a64; }
.timer { width: 100%; height: .5em; border-radius: 999px; background: rgba(255,255,255,.25); overflow: hidden; }
.timer i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); transform-origin: left; }

/* ---------- cards, toasts, overlays ---------- */
.card { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 82%; background: #fff; color: var(--ink); border-radius: 1.3em; padding: 1.3em 1.2em; text-align: center; box-shadow: 0 1em 3em rgba(0,0,0,.45); animation: popc .35s cubic-bezier(.2,1.5,.4,1) both; }
.card h2 { font-family: var(--font-title); font-weight: 400; font-size: 1.35em; margin: 0 0 .5em; text-wrap: balance; }
.card p { margin: 0 0 1em; color: #6b5a74; line-height: 1.4; }
.card input[type=text] { width: 100%; font: inherit; font-size: 1.1em; padding: .7em .9em; border-radius: .8em; border: .15em solid #e3d6e8; text-align: center; color: var(--ink); background: #faf6fb; }
.btn { font-family: var(--font-title); font-size: 1.05em; letter-spacing: .03em; background: var(--accent); color: #fff; border-radius: 999px; padding: .65em 1.6em; box-shadow: 0 .25em 0 #c43a64; transition: transform .1s; }
.btn:active { transform: translateY(.15em); box-shadow: 0 .1em 0 #c43a64; }
.btn.alt { background: #efe7f2; color: var(--ink); box-shadow: 0 .25em 0 #d3c4d9; }
.btn.gold { background: var(--accent-2); box-shadow: 0 .25em 0 #c98618; color: #3b2400; }
.row { display: flex; gap: .6em; justify-content: center; flex-wrap: wrap; margin-top: 1em; }
.toast { position: absolute; left: 50%; top: 4.2em; transform: translateX(-50%); background: #fff; color: var(--ink); border-radius: 999px; padding: .55em 1.1em .55em .6em; display: flex; align-items: center; gap: .55em; font-size: .9em; box-shadow: 0 .6em 1.4em rgba(0,0,0,.35); animation: toast 2.8s cubic-bezier(.2,1.3,.4,1) both; white-space: nowrap; z-index: 35; }
.toast .ic { width: 1.7em; height: 1.7em; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; }
.toast .ic svg { width: 1em; height: 1em; }
.location { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-family: var(--font-title); pointer-events: none; animation: loc 2.2s ease both; }
.location b { display: inline-block; font-weight: 400; font-size: 1.3em; background: rgba(18,10,24,.6); padding: .35em 1em; border-radius: .6em; letter-spacing: .05em; }
.location small { display: block; margin-top: .35em; font-family: var(--font-body); font-size: .8em; opacity: .85; letter-spacing: .2em; text-transform: uppercase; }
.showitem { position: absolute; left: 50%; top: 40%; width: 58%; aspect-ratio: 1; max-width: 100%; transform: translate(-50%, -50%); background: radial-gradient(circle, #fff8e8 0%, #f1e3cc 70%); border-radius: 1.4em; box-shadow: 0 0 0 .4em rgba(255,255,255,.4), 0 1em 3em rgba(0,0,0,.5); animation: popc .4s cubic-bezier(.2,1.6,.4,1) both; display: grid; place-items: center; }
.showitem canvas { width: 92%; height: 92%; }
#fx { pointer-events: none; z-index: 40; }
#fx > * { pointer-events: none; }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; }

/* ---------- menus ---------- */
.sheet { position: absolute; inset: 0; background: rgba(14,8,20,.86); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 50; display: flex; flex-direction: column; padding: 4.2em 1.3em 1.3em; gap: .7em; animation: fadein .2s both; overflow-y: auto; }
.sheet h2 { font-family: var(--font-title); font-weight: 400; font-size: 1.5em; margin: 0 0 .3em; }
.sheet .mbtn { background: rgba(255,255,255,.1); border-radius: .9em; padding: .85em 1em; text-align: left; font-size: 1em; display: flex; justify-content: space-between; align-items: center; }
.sheet .mbtn svg { width: 1.3em; height: 1.3em; opacity: .8; }
.sheet .mbtn:active { background: rgba(255,255,255,.18); }
.setting { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: .4em 1em; background: rgba(255,255,255,.07); border-radius: .9em; padding: .75em 1em; }
.setting input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.history { display: flex; flex-direction: column; gap: .6em; }
.history div { background: rgba(255,255,255,.07); border-radius: .8em; padding: .6em .8em; line-height: 1.35; font-size: .92em; }
.history b { font-family: var(--font-title); font-weight: 400; display: block; font-size: .9em; margin-bottom: .15em; }
.close svg { width: 1.2em; height: 1.2em; }
.close { position: absolute; top: .8em; right: .8em; width: 2.4em; height: 2.4em; border-radius: 50%; background: rgba(255,255,255,.12); display: grid; place-items: center; }

/* ---------- library ---------- */
#screens { z-index: 45; }
.lib { position: absolute; inset: 0; background: linear-gradient(180deg, #2a1636 0%, #1a1020 60%); display: flex; flex-direction: column; animation: fadein .25s both; }
.lib-scroll { flex: 1; overflow-y: auto; padding: 1.1em 1em 1.5em; display: flex; flex-direction: column; gap: 1em; }
.lib-head { display: flex; align-items: baseline; justify-content: space-between; }
.lib-head h1 { font-family: var(--font-title); font-weight: 400; font-size: 1.6em; margin: 0; letter-spacing: .02em; }
.lib-head span { font-size: .78em; color: #c9b6d3; }
.eyebrow { font-size: .72em; letter-spacing: .14em; text-transform: uppercase; color: #c9b6d3; }
.cover { position: relative; border-radius: 1.2em; overflow: hidden; aspect-ratio: 4 / 5; max-width: 100%; box-shadow: 0 1em 2.5em rgba(0,0,0,.5); text-align: left; }
.cover canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.cover .info { position: absolute; left: 0; right: 0; bottom: 0; padding: 3.5em 1em 1em; background: linear-gradient(transparent, rgba(16,8,22,.92) 55%); }
.cover h2 { font-family: var(--font-title); font-weight: 400; font-size: 1.7em; margin: .1em 0 .25em; line-height: 1.05; }
.cover p { margin: 0 0 .8em; font-size: .86em; line-height: 1.4; color: #eadcf0; }
.chips { display: flex; gap: .4em; flex-wrap: wrap; }
.chip { font-size: .7em; padding: .3em .7em; border-radius: 999px; background: rgba(255,255,255,.14); letter-spacing: .05em; }
.ep { display: flex; align-items: center; gap: .8em; background: rgba(255,255,255,.07); border-radius: 1em; padding: .75em .8em; text-align: left; width: 100%; }
.ep .num { width: 2.4em; height: 2.4em; flex: none; border-radius: .7em; background: var(--accent); display: grid; place-items: center; font-family: var(--font-title); font-size: 1em; }
.ep.done .num { background: var(--good); }
.ep .t { flex: 1; min-width: 0; }
.ep .t b { display: block; font-family: var(--font-title); font-weight: 400; font-size: 1.02em; }
.ep .t small { color: #c9b6d3; font-size: .78em; }
.ep .play { font-family: var(--font-title); font-size: .85em; background: #fff; color: var(--ink); padding: .4em .9em; border-radius: 999px; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: #140b1a; padding: .45em .5em calc(.45em + env(safe-area-inset-bottom, 0px)); border-top: 1px solid rgba(255,255,255,.07); }
.tab { display: flex; flex-direction: column; align-items: center; gap: .2em; font-size: .72em; padding: .35em; color: #a996b4; border-radius: .8em; }
.tab svg { width: 1.7em; height: 1.7em; }
.tab.on { color: #fff; background: rgba(255,92,138,.18); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .7em; }
.game { background: rgba(255,255,255,.07); border-radius: 1em; padding: .9em .8em; text-align: left; display: flex; flex-direction: column; gap: .45em; min-width: 0; }
.game .gi { width: 2.6em; height: 2.6em; border-radius: .8em; display: grid; place-items: center; color: #fff; }
.game .gi svg { width: 1.5em; height: 1.5em; }
.game b { font-family: var(--font-title); font-weight: 400; font-size: 1.02em; }
.game small { color: #c9b6d3; font-size: .74em; line-height: 1.35; }
.lab textarea { width: 100%; min-height: 22em; background: #120a18; color: #f0e6f5; border: 1px solid rgba(255,255,255,.12); border-radius: .9em; padding: .8em; font: .78em/1.5 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; resize: vertical; white-space: pre; overflow: auto; }
.lab .errs { display: flex; flex-direction: column; gap: .4em; }
.lab .err { background: rgba(255,93,93,.15); border-radius: .7em; padding: .5em .7em; font-size: .82em; line-height: 1.35; }
.lab .ok { background: rgba(60,200,143,.15); border-radius: .7em; padding: .5em .7em; font-size: .82em; }
.lab select { font: inherit; background: rgba(255,255,255,.1); color: #fff; border: 0; border-radius: .7em; padding: .5em .7em; }
.note { font-size: .8em; color: #c9b6d3; line-height: 1.45; }
.start { position: absolute; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(14,8,20,.5); }

/* ---------- minigames ---------- */
#mg { z-index: 42; }
.mg { position: absolute; inset: 0; background: rgba(18,10,26,.7); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: fadein .25s both; touch-action: none; }
.mg.light { background: linear-gradient(180deg, rgba(18,10,26,.55), transparent 35%, transparent 55%, rgba(18,10,26,.75)); backdrop-filter: none; -webkit-backdrop-filter: none; }
.mg-hud { position: absolute; left: 0; right: 0; top: 0; padding: .9em 1em .6em; display: flex; flex-direction: column; gap: .5em; }
.mg-hud .top { display: flex; justify-content: space-between; align-items: center; gap: .6em; }
.mg-hud .title { font-family: var(--font-title); font-size: 1.15em; text-shadow: 0 .1em 0 rgba(0,0,0,.4); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mg-hud .score { font-family: var(--font-title); background: rgba(255,255,255,.15); padding: .2em .7em; border-radius: 999px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mg-board { position: absolute; left: 0; right: 0; top: 5.6em; bottom: 0; }
.mg-time { height: .55em; background: rgba(255,255,255,.2); border-radius: 999px; overflow: hidden; }
.mg-time i { display: block; height: 100%; background: linear-gradient(90deg, var(--good), var(--accent-2)); transform-origin: left; }
.mg-time.low i { background: var(--bad); }
.count { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-title); font-size: 5em; text-shadow: 0 .06em 0 rgba(0,0,0,.4); pointer-events: none; }
.count span { animation: countpop .8s cubic-bezier(.2,1.6,.4,1) both; }
.stars { display: flex; justify-content: center; gap: .3em; margin: -.2em 0 .7em; }
.stars svg { width: 2.6em; height: 2.6em; color: #e4d9e8; }
.stars svg.on { color: var(--accent-2); animation: starpop .5s cubic-bezier(.2,1.8,.4,1) both; }
.fb { position: absolute; left: 50%; transform: translateX(-50%); font-family: var(--font-title); font-size: 1.6em; pointer-events: none; animation: fbup .7s ease-out both; text-shadow: 0 .08em 0 rgba(0,0,0,.4); white-space: nowrap; }
.mg-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1em; padding: 0 1.2em; }
.big-btn { width: 9em; height: 9em; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #ff8db0, var(--accent)); box-shadow: 0 .45em 0 #b8325a, 0 1em 2em rgba(0,0,0,.4); font-family: var(--font-title); font-size: 1.2em; color: #fff; }
.big-btn:active { transform: translateY(.3em) scale(.97); box-shadow: 0 .15em 0 #b8325a; }
.meter { width: 70%; height: 1.2em; background: rgba(255,255,255,.2); border-radius: 999px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
.tile-grid { display: grid; gap: .5em; width: 100%; }
.mcard { aspect-ratio: 3 / 4; perspective: 30em; max-width: 100%; }
.mcard .in { position: relative; width: 100%; height: 100%; transition: transform .35s; transform-style: preserve-3d; }
.mcard.up .in, .mcard.got .in { transform: rotateY(180deg); }
.mcard .f, .mcard .b { position: absolute; inset: 0; border-radius: .7em; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; }
.mcard .b { background: repeating-linear-gradient(45deg, #ff5c8a 0 .5em, #ff7aa1 .5em 1em); box-shadow: inset 0 0 0 .25em #fff; }
.mcard .f { background: #fff; transform: rotateY(180deg); color: var(--ink); }
.mcard .f svg { width: 60%; height: 60%; }
.mcard.got .f { box-shadow: inset 0 0 0 .25em var(--good); }
.key { background: #fff; color: var(--ink); border-radius: .8em; font-family: var(--font-title); font-size: 1.5em; padding: .45em 0; box-shadow: 0 .2em 0 #d3c4d9; }
.key:active { transform: translateY(.12em); box-shadow: 0 .08em 0 #d3c4d9; }
.display { background: #10141a; color: #8dffb5; font-family: ui-monospace, Menlo, monospace; font-size: 2em; letter-spacing: .35em; text-align: center; padding: .35em; border-radius: .4em; min-height: 1.7em; box-shadow: inset 0 0 0 .1em #2c3a2e; }
.display.bad { color: var(--bad); animation: jitter .1s linear 4; }
.letter { width: 2.4em; height: 2.6em; border-radius: .6em; background: #fff; color: var(--ink); font-family: var(--font-title); font-size: 1.25em; box-shadow: 0 .2em 0 #d3c4d9; display: grid; place-items: center; }
.letter.slot { background: rgba(255,255,255,.15); box-shadow: inset 0 -.15em 0 rgba(255,255,255,.35); color: #fff; }
.letter.used { visibility: hidden; }
.pad { border-radius: 1.2em; opacity: .55; transition: opacity .1s, transform .1s; }
.pad.lit { opacity: 1; transform: scale(1.04); box-shadow: 0 0 2em currentColor; }
.slot-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .5em; background: rgba(20,10,26,.8); border-radius: 999px; padding: .35em; width: 100%; }
.slot-row .lbl { text-align: center; font-family: var(--font-title); line-height: 1.1; }
.slot-row .lbl small { display: block; font-family: var(--font-body); font-size: .68em; color: #c9b6d3; letter-spacing: .12em; text-transform: uppercase; }
.arrow { width: 2.4em; height: 2.4em; border-radius: 50%; background: #fff; color: var(--ink); display: grid; place-items: center; }
.arrow svg { width: 1.2em; height: 1.2em; }

@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes popc { from { transform: translate(-50%, -50%) scale(.5); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }

<script>
const STORIES = {"coffee_ep1": "title: The New Barista\nseries: Coffee & Secrets\nepisode: 1\ngenre: Romance · Mystery\ndescription: Your first day at the Moonbean Café. A charming owner, a mysterious regular, and a locked door nobody talks about.\ncover: coffee_cover\n\n# ---- Cast ----\n# name= is what shows on the name tag. color= tints the tag (and the placeholder art).\ncharacter PLAYER name=\"{player}\" color=#7a9cff hair=loose\ncharacter MAYA name=\"Maya\" color=#ff6f91 haircolor=#3b2230 hair=ponytail outfit=apron\ncharacter LEO name=\"Leo\" color=#46b39d haircolor=#20283a hair=short outfit=jacket\n\n# ---- Scene 1 ----\nEXT. CITY STREET - MORNING\n@music morning_walk\n@weather petals\n\nThe city is just waking up.\nAnd today, so are you... on your first day at a brand new job.\n\ninput player \"What's your name?\" default=\"Alex\"\n\n@PLAYER enters from left to center and is idle_happy\nPLAYER (think) [thought]\nOkay, {player}. Deep breath. You've got this.\n\n@PLAYER walks to offscreen right\n@weather none\n\n# ---- Scene 2 ----\nINT. COFFEE SHOP - DAY [dissolve 1.2]\n@music cafe\n@ambience cafe_chatter\n\n@MAYA spot 1.0 230 0 and faces left\n@PLAYER enters from left to spot 1.0 70 0\n&MAYA is wave\nMAYA (talk_excited)\nYou must be {player}! Welcome to the Moonbean Café!\n\nPLAYER (talk_happy)\nThanks for hiring me! I can't wait to start.\n\n@MAYA walks to center and is talk_happy\nMAYA (talk_happy)\nFirst lesson: the perfect latte. Watch closely.\nIt's all about timing.\n\nminigame timing title=\"Pour the Latte\" instructions=\"Tap when the milk hits the sweet spot!\" rounds=3 need=2 as=latte retries=1\n    win\n        MAYA (cheer)\n        Look at that leaf! You're a natural!\n        set maya_likes + 1\n        @notify \"Maya was impressed.\"\n    lose\n        MAYA (laugh)\n        That's... an abstract leaf. We'll practice!\n\n@zoom on MAYA 1.4 in 0.6\nMAYA (think)\nOne more thing. See that door behind the counter?\nNever, ever go in there.\n@zoom reset\n\nPLAYER (surprised)\nWhy not?\n\nMAYA (nervous): Just... house rules. Anyway!\n\n# ---- A mysterious customer ----\n@sound door_bell\n@LEO enters from right to right and is idle_think\n&PLAYER walks to center and faces right\n@MAYA walks to spot 1.0 62 0 and faces right\n\nLEO (talk_neutral)\nThe usual. And tell the new hire to stop staring.\n\nPLAYER (embarrassed) [thought]\nWas I staring? I was totally staring.\n\nchoice \"How do you respond?\"\n    \"Flirt: 'Hard not to stare.'\" [love]\n        set leo_likes + 1\n        LEO (smug)\n        Bold. I like bold.\n        @notify \"Leo will remember that.\"\n    \"Stay professional.\"\n        PLAYER (talk_happy)\n        One usual, coming right up!\n        LEO (neutral): Hm. Efficient.\n    \"Ask about the locked door.\" [if latte_won]\n        PLAYER (nervous) [whispers]\n        Hey... what's behind the door in the back?\n        @LEO is gasp\n        LEO (shocked) [whispers]\n        You shouldn't ask that here.\n        set curious + 1\n    \"Ask Maya for help.\" [locked if maya_likes >= 2]\n        MAYA (happy): I'll take this one!\n\n@LEO looks neutral\nLEO\nQuiz time, new hire. If you're going to serve me every morning, you should know the menu.\n\nminigame quiz title=\"Menu Quiz\" pass=2\n    Q: What's in a cortado?\n    * Espresso and a little warm milk\n    - Espresso and whipped cream\n    - Cold brew and oat milk\n    Q: Which drink has the most foam?\n    * Cappuccino\n    - Flat white\n    - Americano\n    Q: What's the café's secret ingredient?\n    * Love (and a pinch of cinnamon)\n    - Glitter\n    - Nobody knows\n    win\n        LEO (smile)\n        Not bad. Maybe you'll last a week.\n        set leo_likes + 1\n    lose\n        LEO (sigh)\n        We'll work on it.\n\n@LEO exits right\n@MAYA walks to center\n\nMAYA (talk_happy)\nHe's... a lot. But he tips well.\nLet's clean up before closing.\n\n# ---- Scene 3 ----\nINT. COFFEE SHOP - NIGHT [fade 1.5]\n@music night_theme\n@tint night\n@weather rain\n\nYou're alone, wiping down the counter, when your phone buzzes.\n\nLEO [phone]\nMeet me at the back door. Bring the key under the register.\n\nPLAYER (scared) [thought]\nHow does he know about a key?\n\n@show old_key\nYou find an old brass key, cold and heavy in your hand.\n@hide old_key\n\n@shake 0.6\n@flash white\n@sound thunder\n\nPLAYER (gasp)\nOkay. Okay. The door has a keypad too.\n\nminigame keypad title=\"The Locked Door\" code=0315 tries=3 hint=\"A note taped under the counter: 'Grand opening: March 15'\" as=door\n    win\n        @sound door_open\n        The lock clicks open.\n        set opened_door\n    lose\n        The keypad flashes red and goes dark.\n        PLAYER (sad): Maybe that's a sign.\n\nif opened_door\n    @MAYA appears at center and is angry\n    MAYA (angry) [shouts]\n    {player}! What are you doing?!\n    @MAYA is cry\n    MAYA (sad)\n    That room... it's where my sister kept her things.\nelse\n    @MAYA enters from left to center and is worried\n    MAYA (worried)\n    Still here? Go home, it's late.\n\n@tint none\n@weather none\n@zoom on MAYA 1.3 in 1\nMAYA (sigh)\nTomorrow. I'll tell you everything tomorrow.\n@zoom reset\n\nnext coffee_ep2\n", "coffee_ep2": "title: The Party\nseries: Coffee & Secrets\nepisode: 2\n\ncharacter PLAYER name=\"{player}\" color=#7a9cff hair=loose\ncharacter MAYA name=\"Maya\" color=#ff6f91 haircolor=#3b2230 hair=bun outfit=dress\ncharacter LEO name=\"Leo\" color=#46b39d haircolor=#20283a hair=short outfit=suit\n\nINT. BEDROOM - EVENING\n@music getting_ready\n\nPLAYER (talk_excited) [thought]\nMaya invited me to the café's anniversary party. I need the perfect look.\n\nminigame dressup character=PLAYER title=\"Get Ready\"\n    outfit: casual, dress, suit, sweater\n    hair: loose, ponytail, bun\n\nPLAYER (happy)\nPerfect. Let's go!\n\nEXT. ROOFTOP PARTY - NIGHT [fade]\n@music party\n@weather sparkles\n\n@MAYA spot 1.0 80 0 and faces right\n@LEO spot 1.05 250 0 and faces left\n@PLAYER enters from bottom to center\n\nMAYA (talk_happy)\nYou came! And you look amazing in that {PLAYER_outfit}.\n\nif leo_likes >= 2\n    LEO (smug)\n    I'll admit it. You clean up nicely, {player}.\n    @PLAYER is blush\nelif opened_door\n    LEO (serious)\n    We need to talk about last night.\nelse\n    LEO (neutral): Hey.\n\nMAYA (talk_excited)\nDance-off! Loser buys tomorrow's pastries!\n\nminigame rhythm title=\"Dance-Off\" bpm=118 notes=20 lanes=3 need=65\n    win\n        @PLAYER is dance_loop\n        MAYA (laugh): Okay, okay, you win!\n        @PLAYER is idle_happy\n    lose\n        @MAYA is cheer\n        MAYA (laugh): Croissants are on you!\n\n&LEO exits right\n@MAYA walks to spot 1.0 82 0 and is talk_happy\n@PLAYER faces left\nMAYA\nThanks for being here. It's been a long time since this place felt like home.\n\nchoice timed 6 \"Quick! What do you do?\"\n    \"Hug her.\" [default]\n        @PLAYER walks to next to MAYA\n        @MAYA is love\n        MAYA (happy): ...Thank you.\n        set maya_likes + 2\n    \"Toast to the café!\"\n        @PLAYER is cheer\n        MAYA (laugh): To the Moonbean!\n\nTo be continued...\n"};
// ===== Story language: parser, expressions, variables, runner (port of the Unity core) =====
const Core = (() => {
  const COMMAND_VERBS = new Set("wait pause zoom pan shake flash fade transition music sound sfx ambience ambient notify weather overlay show hide tint clear vibrate autosave voice textbox bubble camera stop".split(" "));
  const META_KEYS = new Set("title series episode author description cover genre start".split(" "));
  const REACTIONS = { jumps: "jump", nods: "nod", shakes: "shake_head", laughs: "laugh", bounces: "bounce", gasps: "gasp", sighs: "sigh", shivers: "shiver", trembles: "shiver", waves: "wave", cries: "cry", dances: "dance", spins: "spin", shrugs: "shrug", bows: "bow", cheers: "cheer", flinches: "flinch", giggles: "giggle", pouts: "pout", thinks: "think", leans: "lean", stomps: "stomp", hops: "hop", faints: "faint", blushes: "blush" };
  const SCENE = /^(INT\.?\/EXT|EXT\.?\/INT|I\/E|INT|EXT)[.\s]/;
  const SPEAKER = /^([A-Z][A-Z0-9_'.\- ]*?)\s*(?:\(([^)]*)\))?\s*(?:\[([^\]]*)\])?\s*(?::\s*(.*))?$/;
  const SET = /^set\s+([A-Za-z_][A-Za-z0-9_.]*)\s*(\+=|-=|\*=|\/=|=|\+|-|to\b)?\s*(.*)$/i;
  const BRACKET = /\[([^\]]*)\]/g;

  class StoryError extends Error { constructor(line, msg) { super(msg); this.line = line; } }

  function tryFloat(s) {
    if (s == null) return null;
    s = String(s);
    if (s.length > 1 && /s$/i.test(s) && /\d/.test(s[s.length - 2])) s = s.slice(0, -1);
    if (!/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(s)) return null;
    return parseFloat(s);
  }
  const isNum = s => tryFloat(s) !== null;
  const isIdent = s => /^[A-Za-z_][A-Za-z0-9_.]*$/.test(s);

  function tokenize(line, opts) {
    const words = []; let sb = "", quoted = false, had = false;
    for (let i = 0; i <= line.length; i++) {
      const c = i < line.length ? line[i] : " ";
      if (c === '"' || (quoted && c === "”") || (!quoted && c === "“")) { quoted = !quoted; had = true; continue; }
      if (!quoted && /\s/.test(c)) {
        if (sb.length || had) {
          const eq = sb.indexOf("=");
          if (opts && eq > 0 && eq < sb.length - 1 && !sb.includes("==") && isIdent(sb.slice(0, eq))) opts[sb.slice(0, eq).toLowerCase()] = sb.slice(eq + 1).replace(/^"|"$/g, "");
          else words.push(sb);
        }
        sb = ""; had = false; continue;
      }
      sb += c;
    }
    return words;
  }

  function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, ""); }
  function fmtNum(d) { return Math.abs(d - Math.round(d)) < 1e-9 ? String(Math.round(d)) : String(Math.round(d * 100) / 100); }

  // ---------- variables & expressions ----------
  const toNumber = v => v == null ? 0 : typeof v === "number" ? v : typeof v === "boolean" ? (v ? 1 : 0) : (isNum(v) ? parseFloat(v) : 0);
  const toBool = v => v == null ? false : typeof v === "boolean" ? v : typeof v === "number" ? Math.abs(v) > 1e-9 : (v.length > 0 && v.toLowerCase() !== "false" && v !== "0");
  const toText = v => v == null ? "" : typeof v === "number" ? fmtNum(v) : typeof v === "boolean" ? (v ? "true" : "false") : String(v);

  class Vars {
    constructor() { this.v = {}; }
    get(n) { const k = n.toLowerCase(); return k in this.v ? this.v[k] : 0; }
    has(n) { return n.toLowerCase() in this.v; }
    set(n, val) { this.v[n.toLowerCase()] = val; }
    interpolate(text, resolver) {
      if (!text || text.indexOf("{") < 0) return text;
      let out = "";
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === "{" && text[i + 1] === "{") { out += "{"; i++; continue; }
        if (c === "{") {
          const close = text.indexOf("}", i + 1);
          if (close > i) { const name = text.slice(i + 1, close).trim(); const r = resolver && resolver(name); out += r != null ? r : toText(this.get(name)); i = close; continue; }
        }
        out += c;
      }
      return out;
    }
  }

  function parseExpr(src) {
    let p = 0;
    const s = src;
    const space = () => { while (p < s.length && /\s/.test(s[p])) p++; };
    const match = (tok, word) => {
      space();
      if (s.substr(p, tok.length).toLowerCase() !== tok) return false;
      if (word && p + tok.length < s.length && /[A-Za-z0-9_]/.test(s[p + tok.length])) return false;
      p += tok.length; return true;
    };
    const eq = (a, b) => {
      if (typeof a === "string" || typeof b === "string") return toText(a).toLowerCase() === toText(b).toLowerCase();
      if (typeof a === "boolean" || typeof b === "boolean") return toBool(a) === toBool(b);
      return Math.abs(toNumber(a) - toNumber(b)) < 1e-9;
    };
    const bin = (op, l, r) => vars => {
      if (op === "and") return toBool(l(vars)) && toBool(r(vars));
      if (op === "or") return toBool(l(vars)) || toBool(r(vars));
      const a = l(vars), b = r(vars);
      switch (op) {
        case "+": return (typeof a === "string" || typeof b === "string") ? toText(a) + toText(b) : toNumber(a) + toNumber(b);
        case "-": return toNumber(a) - toNumber(b);
        case "*": return toNumber(a) * toNumber(b);
        case "/": { const d = toNumber(b); return Math.abs(d) < 1e-12 ? 0 : toNumber(a) / d; }
        case "%": { const d = toNumber(b); return Math.abs(d) < 1e-12 ? 0 : toNumber(a) % d; }
        case "==": return eq(a, b);
        case "!=": return !eq(a, b);
        case "<": return toNumber(a) < toNumber(b);
        case "<=": return toNumber(a) <= toNumber(b);
        case ">": return toNumber(a) > toNumber(b);
        case ">=": return toNumber(a) >= toNumber(b);
      }
    };
    function or() { let l = and(); while (match("or", true) || match("||")) l = bin("or", l, and()); return l; }
    function and() { let l = not(); while (match("and", true) || match("&&")) l = bin("and", l, not()); return l; }
    function not() {
      if (match("not", true)) { const o = not(); return v => !toBool(o(v)); }
      space();
      if (s[p] === "!" && s[p + 1] !== "=") { p++; const o = not(); return v => !toBool(o(v)); }
      return cmp();
    }
    function cmp() {
      const l = add();
      for (const op of ["==", "!=", "<=", ">=", "<", ">", "="]) if (match(op)) return bin(op === "=" ? "==" : op, l, add());
      if (match("is not", true)) return bin("!=", l, add());
      if (match("is", true)) return bin("==", l, add());
      return l;
    }
    function add() { let l = mul(); for (;;) { if (match("+")) l = bin("+", l, mul()); else if (match("-")) l = bin("-", l, mul()); else return l; } }
    function mul() { let l = un(); for (;;) { if (match("*")) l = bin("*", l, un()); else if (match("/")) l = bin("/", l, un()); else if (match("%")) l = bin("%", l, un()); else return l; } }
    function un() { if (match("-")) { const o = un(); return v => -toNumber(o(v)); } return atom(); }
    function atom() {
      space();
      if (p >= s.length) throw new Error(`Expression '${s}' ends too early`);
      const c = s[p];
      if (c === "(") { p++; const e = or(); if (!match(")")) throw new Error(`Missing ')' in '${s}'`); return e; }
      if (c === '"' || c === "'") { const end = s.indexOf(c, p + 1); if (end < 0) throw new Error(`Missing closing quote in '${s}'`); const lit = s.slice(p + 1, end); p = end + 1; return () => lit; }
      if (/[0-9.]/.test(c)) { const st = p; while (p < s.length && /[0-9.]/.test(s[p])) p++; const n = parseFloat(s.slice(st, p)); return () => n; }
      if (/[A-Za-z_]/.test(c)) {
        const st = p; while (p < s.length && /[A-Za-z0-9_.]/.test(s[p])) p++;
        const name = s.slice(st, p);
        if (name.toLowerCase() === "true") return () => true;
        if (name.toLowerCase() === "false") return () => false;
        return vars => vars.get(name);
      }
      throw new Error(`Unexpected '${c}' in '${s}'`);
    }
    const e = or(); space();
    if (p < s.length) throw new Error(`Unexpected '${s.slice(p)}' in '${s}'`);
    e.source = src;
    return e;
  }

  // ---------- parser ----------
  function firstWord(t) { let k = 0; while (k < t.length && !/\s/.test(t[k]) && !":([".includes(t[k])) k++; return t.slice(0, k); }

  function parse(source, name) {
    const prog = { name: name || "story", ins: [], labels: {}, meta: {}, chars: {}, errors: [] };
    const out = prog.ins;
    const pending = [];
    const err = (n, msg, warn) => prog.errors.push({ line: n.line, msg, src: n.text, warn: !!warn });
    const emit = (ins, n, par) => { ins.line = n.line; ins.parallel = !!par; out.push(ins); return ins; };

    // indentation tree
    const roots = [], stack = [];
    let blank = false;
    source.replace(/\r\n?/g, "\n").split("\n").forEach((raw0, i) => {
      const raw = raw0.replace(/\t/g, "    "), tr = raw.trim();
      if (!tr) { blank = true; return; }
      if (tr.startsWith("#") || tr.startsWith("//") || tr === "{" || tr === "}") return;
      const indent = raw.length - raw.replace(/^\s+/, "").length;
      const node = { line: i + 1, indent, text: tr.replace(/\{$/, "").trim(), blank, children: [] };
      blank = false;
      while (stack.length && stack[stack.length - 1].indent >= indent) stack.pop();
      (stack.length ? stack[stack.length - 1].children : roots).push(node);
      stack.push(node);
    });

    const isSpeakerName = n => n.length > 0 && n.length <= 40 && (n in prog.chars || (n === n.toUpperCase() && /[A-Za-z]/.test(n)));
    const isPlain = t => {
      if (t.startsWith("@") || t.startsWith("&") || SCENE.test(t)) return false;
      const w = firstWord(t).toLowerCase();
      if (w === t.split(" ")[0] && (COMMAND_VERBS.has(w) || ["choice", "if", "set", "goto", "label", "minigame", "input", "next", "end", "call", "return"].includes(w))) return false;
      const m = t.match(SPEAKER);
      if (m && isSpeakerName(m[1].trim()) && (m[2] !== undefined || m[4] !== undefined)) return false;
      return true;
    };
    const X = (n, f) => { try { return f(); } catch (e) { throw new StoryError(n.line, "Couldn't read the condition: " + e.message); } };
    const expr = (n, s) => X(n, () => parseExpr(s));

    function block(nodes) {
      const st = { speaker: null, anim: null, style: null };
      for (let i = 0; i < nodes.length; i++) {
        if (nodes[i].blank) { st.speaker = st.anim = st.style = null; }
        try { i = statement(nodes, i, st); }
        catch (e) { prog.errors.push({ line: e.line || nodes[i].line, msg: e.message, src: nodes[i].text }); }
      }
    }
    function say(n, speaker, anim, style, text) {
      if (text.length >= 2 && text[0] === '"' && text[text.length - 1] === '"') text = text.slice(1, -1);
      emit({ type: "say", speaker, anim: anim || null, style: speaker == null ? (style || "narration") : (style || "speech"), text }, n);
    }
    function statement(nodes, i, st) {

  }
  clearCharacters() { for (const c of this.chars.values()) { c.onStage = false; c.alpha = 0; c.gesture = null; } this.cam = { z: 1, fx: 0.5, fy: 0.5 }; }
  namedX(n) {
    return { left: 72, center: 160, right: 248, far_left: 30, far_right: 290, offscreen_left: -90, offscreen_right: 410, offscreen_top: 160, offscreen_bottom: 160 }[n] ?? 160;
  }
  resolve(pos, c) {

  camTo(z, fx, fy, dur) {

  setTint(name, dur) {

  }
  setWeather(w) {
    this.weather = (w || "none").toLowerCase();
    if (this.weather === "none" || this.weather === "off" || this.weather === "clear") { this.weather = "none"; }
  }
  camTransform() {
    const z = this.cam.z, W = this.W, H = this.H;
    const hw = W / (2 * z), hh = H / (2 * z);

    return { z, tx: W / 2 - cx * z, ty: H / 2 - cy * z };
  }
  toScreen(x, y) { const T = this.camTransform(); return { x: x * T.z + T.tx, y: y * T.z + T.ty, z: T.z }; }
  updateWeather(dt) {
    const W = this.W, H = this.H, w = this.weather;
    const want = { rain: 140, storm: 220, snow: 90, petals: 34, leaves: 26, sparkles: 40, dust: 30 }[w] || 0;
    while (this.particles.length < want) this.particles.push(this.spawn(w, true));
    if (this.particles.length > want) this.particles.length = want;
    for (const p of this.particles) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; p.life += dt;
      if (w === "petals" || w === "leaves" || w === "snow") p.x += Math.sin(p.life * p.wob) * 20 * dt;
      if (p.y > H + 20 || p.x < -40 || p.x > W + 40 || (w === "sparkles" && p.life > p.max)) Object.assign(p, this.spawn(w, false));
    }
  }
  spawn(w, initial) {
    const W = this.W, H = this.H, R = Math.random;
    const p = { x: R() * W, y: initial ? R() * H : -20, vx: 0, vy: 0, r: R() * 6, vr: (R() - 0.5) * 3, life: 0, max: 1, s: 1, wob: 1 + R() * 2 };

    else if (w === "petals" || w === "leaves") { p.vy = H * (0.07 + R() * 0.08); p.vx = W * 0.05; p.s = 0.7 + R() * 0.7; }

  drawWeather(g) {

      else if (w === "petals" || w === "leaves") {
        g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.scale(1, Math.abs(Math.sin(p.life * 3 + p.wob)) * 0.6 + 0.4);
        g.fillStyle = w === "petals" ? "rgba(255,170,200,.95)" : "rgba(214,140,60,.95)"; g.beginPath(); g.ellipse(0, 0, 6 * p.s, 3.5 * p.s, 0, 0, 7); g.fill(); g.restore();
      } else if (w === "sparkles") {
        const a = Math.sin(p.life / p.max * Math.PI); g.fillStyle = `rgba(255,240,180,${a})`;
        g.save(); g.translate(p.x, p.y); g.rotate(p.life); const s = 5 * p.s * a;

    }
    if (w === "storm" && Math.random() < 0.004) this.lightning = 1;
    if (this.lightning > 0) { g.fillStyle = `rgba(255,255,255,${this.lightning * 0.5})`; g.fillRect(0, 0, this.W, this.H); this.lightning -= 0.08; }
  }
  frame(dt, t) {
    const g = this.g, W = this.W, H = this.H;
    g.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    g.fillStyle = "#120c18"; g.fillRect(0, 0, W, H);

  }
  snapshot() {
    return {
      bg: this.bgName, tint: this.tintA > 0.5 ? this.tintColor : null, weather: this.weather,
      chars: [...this.chars.values()].filter(c => c.onStage).map(c => ({ id: c.id, x: c.x, y: c.y, s: c.scale, f: c.facing, e: c.emotion, l: c.layer, slots: { ...c.look.slots }, hold: c.hold })),
    };
  }
  restore(s) {
    this.reset();
    if (s.bg) { this.bgName = s.bg; this.bg = Art.background(s.bg, this.canvas.width, this.canvas.height); }

      if (d.hold) { c.gesture = d.hold; c.hold = d.hold; c.gStart = -10; c.gDur = 0.6; }
    }
  }
}

// ===== Audio: built-in sound effects and generated music loops =====
const Audio2 = (() => {
  let ctx = null, master, musicBus, sfxBus, ambBus, noiseBuf;
  const st = { music: 0.55, sfx: 0.8, on: true };
  try { const s = JSON.parse(localStorage.getItem("vn_audio") || "null"); if (s) Object.assign(st, s); } catch (e) {}
  const save = () => { try { localStorage.setItem("vn_audio", JSON.stringify(st)); } catch (e) {} };

  function init() {
    if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    master = ctx.createGain(); master.connect(ctx.destination);
    musicBus = ctx.createGain(); musicBus.connect(master);
    sfxBus = ctx.createGain(); sfxBus.connect(master);
    ambBus = ctx.createGain(); ambBus.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    apply();
  }
  function apply() {
    if (!ctx) return;
    master.gain.value = st.on ? 1 : 0;
    musicBus.gain.value = st.music * 0.5;
    sfxBus.gain.value = st.sfx * 0.7;
    ambBus.gain.value = st.sfx * 0.35;

  function tone(freq, t, dur, type, vol, bus, attack, slideTo) {

    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.3, t + (attack || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus || sfxBus); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(t, dur, vol, type, freq, bus, q) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = type || "lowpass"; f.frequency.value = freq || 1000; if (q) f.Q.value = q;
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(bus || sfxBus); s.start(t, Math.random()); s.stop(t + dur + 0.05);
  }
  const N = n => 440 * Math.pow(2, (n - 69) / 12);

  const SFX = {
    click: t => tone(880, t, 0.06, "triangle", 0.2),
    pop: t => tone(520, t, 0.12, "sine", 0.3, null, 0.004, 980),
    blip: t => tone(1200, t, 0.04, "square", 0.05),
    success: t => [72, 76, 79, 84].forEach((n, i) => tone(N(n), t + i * 0.08, 0.3, "triangle", 0.22)),
    fail: t => [67, 63, 60].forEach((n, i) => tone(N(n), t + i * 0.12, 0.35, "triangle", 0.2)),
    whoosh: t => noise(t, 0.35, 0.25, "bandpass", 1400, null, 0.8),
    hit: t => tone(N(84), t, 0.12, "triangle", 0.25),
    miss: t => tone(160, t, 0.18, "sawtooth", 0.08, null, 0.004, 90),
    match: t => { tone(N(79), t, 0.15, "triangle", 0.2); tone(N(86), t + 0.08, 0.25, "triangle", 0.2); },
    right: t => { tone(N(76), t, 0.12, "triangle", 0.22); tone(N(83), t + 0.09, 0.25, "triangle", 0.22); },
    wrong: t => tone(180, t, 0.25, "square", 0.08, null, 0.004, 120),
    tick: t => tone(1500, t, 0.03, "sine", 0.1),
    count: t => tone(N(72), t, 0.15, "triangle", 0.25),
    go: t => tone(N(84), t, 0.35, "triangle", 0.3),
    door_bell: t => { tone(N(88), t, 1.2, "sine", 0.22); tone(N(84), t + 0.18, 1.4, "sine", 0.2); tone(N(100), t, 0.6, "sine", 0.05); },
    thunder: t => { noise(t, 2.2, 0.7, "lowpass", 220); noise(t + 0.1, 1.2, 0.4, "lowpass", 600); },
    door_open: t => { noise(t, 0.25, 0.3, "bandpass", 900, null, 3); tone(140, t + 0.05, 0.4, "sawtooth", 0.05, null, 0.01, 90); },
    door: t => noise(t, 0.2, 0.4, "lowpass", 400),
    knock: t => [0, 0.18, 0.36].forEach(d => noise(t + d, 0.08, 0.6, "lowpass", 300)),
    phone: t => [0, 0.15].forEach(d => tone(N(88), t + d, 0.1, "square", 0.06)),
    notify: t => { tone(N(81), t, 0.18, "sine", 0.2); tone(N(88), t + 0.1, 0.3, "sine", 0.2); },
    catch: t => tone(N(81), t, 0.1, "triangle", 0.22, null, 0.004, N(88)),
    ouch: t => tone(300, t, 0.2, "square", 0.08, null, 0.004, 140),
    flip: t => noise(t, 0.08, 0.25, "highpass", 2500),
    type: t => tone(1800 + Math.random() * 300, t, 0.018, "sine", 0.03),
  };
  function sfx(name) {
    init(); if (!ctx || !st.on) return;
    const n = (name || "").toLowerCase();
    let f = SFX[n];
    if (!f && n.startsWith("note_")) { const k = +n.slice(5) || 1; f = t => tone(N([60, 64, 67, 72, 76, 79][(k - 1) % 6]), t, 0.35, "triangle", 0.25); }
    if (!f) { if (/bell|ding/.test(n)) f = SFX.door_bell; else if (/thunder|boom|crash/.test(n)) f = SFX.thunder; else if (/door/.test(n)) f = SFX.door_open; else f = SFX.pop; }

  }
  function voice(pitch) {
    if (!ctx || !st.on) return;
    tone(pitch, ctx.currentTime, 0.05, "triangle", 0.035);
  }

  // ---------- music ----------
  let musicTimer = null, musicName = null, musicGain = null;
  const MODES = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10] };
  function style(name) {
    const n = name.toLowerCase();
    if (/party|dance|club|battle|minigame|rhythm/.test(n)) return { bpm: 118, mode: "major", root: 57, prog: [0, 5, 3, 4], drums: 2, bright: 1 };
    if (/night|sad|mystery|secret|dark|rain/.test(n)) return { bpm: 72, mode: "minor", root: 57, prog: [0, 5, 2, 6], drums: 0, bright: 0 };
    if (/cafe|coffee|jazz/.test(n)) return { bpm: 92, mode: "major", root: 60, prog: [1, 4, 0, 5], drums: 1, bright: 0.6, seventh: 1 };
    if (/ready|morning|walk|happy/.test(n)) return { bpm: 104, mode: "major", root: 62, prog: [0, 4, 5, 3], drums: 1, bright: 1 };
    const h = Art.hash(n);
    return { bpm: 84 + h % 30, mode: h % 2 ? "minor" : "major", root: 55 + h % 8, prog: [0, 3 + h % 3, 5, 4], drums: h % 3 === 0 ? 1 : 0, bright: 0.5 };
  }
  function chordNotes(S, deg) {
    const sc = MODES[S.mode], pick = i => S.root + sc[(deg + i) % 7] + 12 * Math.floor((deg + i) / 7);
    const notes = [pick(0), pick(2), pick(4)]; if (S.seventh) notes.push(pick(6));
    return notes;
  }
  function music(name, fade) {
    init(); if (!ctx) return;
    if (!name || name === "none" || name === "stop" || name === "off") { stopMusic(fade); return; }
    if (name === musicName) return;
    stopMusic(1);
    musicName = name;
    const S = style(name), beat = 60 / S.bpm, bar = beat * 4;
    musicGain = ctx.createGain(); musicGain.gain.setValueAtTime(0.0001, ctx.currentTime); musicGain.gain.exponentialRampToValueAtTime(1, ctx.currentTime + 1.5);
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1800 + S.bright * 2200;

    const R = (() => { let s = Art.hash(name); return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
    const pattern = Array.from({ length: 8 }, () => Math.floor(R() * 4));
    const sched = () => {
      while (next < ctx.currentTime + 0.6) {
        const deg = S.prog[barN % S.prog.length], ch = chordNotes(S, deg);
        // pad
        for (const n of ch) { tone(N(n), next, bar * 1.02, "triangle", 0.045, bus, 0.4); tone(N(n) * 1.004, next, bar * 1.02, "sine", 0.03, bus, 0.5); }
        // bass
        tone(N(ch[0] - 24), next, beat * 1.8, "triangle", 0.16, bus, 0.01);
        tone(N(ch[0] - 24 + (S.mode === "minor" ? 7 : 7)), next + beat * 2, beat * 1.8, "triangle", 0.12, bus, 0.01);
        // arpeggio
        for (let i = 0; i < 8; i++) {
          if (S.drums === 0 && i % 2) continue;
          const p = pattern[(i + barN) % 8];
          tone(N(ch[p % ch.length] + 12), next + i * beat / 2, beat * 0.9, "sine", 0.06 + S.bright * 0.02, bus, 0.005);
        }
        if (S.drums) for (let i = 0; i < 4; i++) {
          const t = next + i * beat;
          if (S.drums === 2 || i % 2 === 0) { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.15); g.gain.setValueAtTime(S.drums === 2 ? 0.5 : 0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2); o.connect(g); g.connect(bus); o.start(t); o.stop(t + 0.25); }

    src.connect(f); f.connect(g); g.connect(ambBus); src.start();
    amb = { src, g };
  }
  function stopAll() { stopMusic(0.6); ambience(null); }

  return {
    init, sfx, voice, music, ambience, stopAll, get state() { return st; },
    set(k, v) { st[k] = v; apply(); save(); },
    get musicName() { return musicName; }, get ambName() { return ambName; },
  };
})();

const UI = (() => {
  let frame, ui, fx, mgLayer, screens, hud;
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const updaters = new Set();
  let tapWaiters = [];
  const mode = { auto: false, skip: false, speed: 40 };
  try { const s = JSON.parse(localStorage.getItem("vn_ui") || "null"); if (s && s.speed) mode.speed = s.speed; } catch (e) {}

  function init(f) {
    frame = f;
    ui = f.querySelector("#ui"); fx = f.querySelector("#fx"); mgLayer = f.querySelector("#mg"); screens = f.querySelector("#screens"); hud = f.querySelector("#hud");
    f.addEventListener("pointerdown", e => {
      if (e.target.closest("button, input, textarea, select, .mg, .sheet, .lib, .card")) return;
      const w = tapWaiters; tapWaiters = [];
      w.forEach(fn => fn());
    });
  }
  function onTap() { return new Promise(r => tapWaiters.push(r)); }
  // pulse(): resolves on the next mode change (auto/skip toggled) or when typing finishes
  let pulseWaiters = [];
  function pulse() { return new Promise(r => pulseWaiters.push(() => r("pulse"))); }
  function kick() { const w = pulseWaiters; pulseWaiters = []; w.forEach(f => f()); }
  function cancelTaps() { tapWaiters = []; }

  // ---------- dialogue ----------
  let bubble = null;
  function placeBubble(b) {
    if (!b || !b.anchor) return;
    const a = b.anchor();
    const W = frame.clientWidth, H = frame.clientHeight;
    const bw = b.el.offsetWidth, bh = b.el.offsetHeight;
    if (!a) { b.el.style.left = (W - bw) / 2 + "px"; b.el.style.top = H * 0.06 + "px"; if (b.tail) b.tail.style.display = "none"; return; }
    const x = Math.max(W * 0.05, Math.min(W * 0.95 - bw, a.x - bw / 2));
    const y = Math.max(H * 0.07, Math.min(H * 0.5, a.y - bh - H * 0.035));
    b.el.style.left = x + "px"; b.el.style.top = y + "px";
    const tx = Math.max(16, Math.min(bw - 34, a.x - x - 10));
    if (b.tail) { b.tail.style.display = ""; b.tail.style.left = tx + "px"; }
    if (b.dots) { b.dots.style.left = tx + "px"; }
  }
  // opts: { name, color, style, text, anchor(), onLetter(ch), onDone() }
  function say(o) {
    return new Promise(resolve => {
      clearBubble();
      const style = o.style || "speech";
      let root, textEl;
      if (style === "phone") {
        root = el("div", "phone", `<div class="bar"><div class="avatar" style="background:${o.color || "#3a7bff"}">${esc((o.name || "?")[0])}</div><span>${esc(o.name || "Unknown")}</span></div><div class="msg"></div>`);
        textEl = root.querySelector(".msg");
        Audio2.sfx("phone");
      } else {
        root = el("div", "bubble " + style);
        if (o.name && style !== "narration") { const n = el("div", "name", esc(o.name)); n.style.background = o.color || "#ff5c8a"; root.appendChild(n); }
        textEl = el("div", "text"); root.appendChild(textEl);
        root.appendChild(el("div", "more"));
      }
      const b = { el: root, anchor: style === "narration" || style === "phone" ? null : o.anchor };
      if (style === "narration") { root.style.top = "40%"; }
      if (b.anchor) {
        if (style === "thought") { b.dots = el("div", "dots", '<i style="width:.9em;height:.9em;left:.2em;top:0"></i><i style="width:.5em;height:.5em;left:.5em;top:1.05em"></i>'); root.appendChild(b.dots); }
        else { b.tail = el("div", "tail"); root.appendChild(b.tail); }
      } else if (style !== "narration" && style !== "phone") {
        b.anchor = () => null;
      }
      ui.appendChild(root);
      bubble = b;
      placeBubble(b);
      const text = o.text;
      let shown = 0, acc = 0, done = false;
      const finish = () => { if (done) return; done = true; shown = text.length; textEl.textContent = text; root.classList.add("done"); updaters.delete(typer); o.onDone && o.onDone(); placeBubble(b); kick(); };
      const typer = dt => {
        if (mode.skip) { finish(); return; }
        acc += dt * mode.speed * (style === "shout" ? 1.3 : 1);
        while (acc >= 1 && shown < text.length) {
          acc -= 1; const ch = text[shown++];
          o.onLetter && o.onLetter(ch, shown);
          if (/[.,!?…]/.test(ch)) acc -= ch === "," ? 2 : 5;
        }
        textEl.innerHTML = esc(text.slice(0, shown)) + '<span style="visibility:hidden">' + esc(text.slice(shown)) + '</span>';
        if (shown >= text.length) finish();
      };
      b.update = () => placeBubble(b);
      updaters.add(typer);
      const advance = async () => {
        for (;;) {
          if (mode.skip) { finish(); await Clock.wait(0.1); break; }
          if (mode.auto && done) {
            const r = await Promise.race([onTap().then(() => "tap"), Clock.wait(1.0 + text.length * 0.03).then(() => "auto"), pulse()]);
            if (r === "tap" || r === "auto") break;
            continue;
          }
          const r = await Promise.race([onTap().then(() => "tap"), pulse()]);
          if (r !== "tap") continue;
          if (!done) { finish(); continue; }
          Audio2.sfx("click");
          break;
        }
        resolve();
      };
      advance();
    });
  }
  function clearBubble() { if (bubble) { bubble.el.remove(); bubble = null; } }

  // ---------- choices ----------
  function choice(prompt, options, timer) {
    return new Promise(resolve => {
      clearBubble();
      const box = el("div"); box.id = "choices";
      if (prompt) box.appendChild(el("div", "prompt", esc(prompt)));
      let bar = null;
      if (timer) { const t = el("div", "timer", "<i></i>"); box.appendChild(t); bar = t.firstChild; }
      let chosen = false;
      const pick = (i, btn) => {
        if (chosen) return; chosen = true;
        Audio2.sfx("pop");
        if (btn) btn.classList.add("chosen");
        setTimeout(() => { box.remove(); resolve(i); }, 260);
      };
      options.forEach((o, i) => {
        const icon = !o.enabled ? ICON.lock : o.tag ? (ICON[o.tag.toLowerCase()] || ICON.star) : null;
        const b = el("button", "opt" + (o.enabled ? "" : " locked"), (icon ? `<span class="ic">${icon}</span>` : "") + `<span>${esc(o.text)}</span>`);
        b.style.animationDelay = (0.06 + i * 0.07) + "s";
        b.onclick = () => { if (o.enabled) pick(i, b); else { b.animate([{ translate: "-.3em 0" }, { translate: ".3em 0" }, { translate: "0 0" }], { duration: 200 }); Audio2.sfx("wrong"); } };
        box.appendChild(b);
      });
      ui.appendChild(box);
      if (timer) {
        const start = Clock.now;
        const tick = () => {
          if (chosen) { updaters.delete(tick); return; }
          const k = Math.min(1, (Clock.now - start) / timer);
          bar.style.transform = `scaleX(${1 - k})`;
          if (k >= 1) { updaters.delete(tick); const d = options.findIndex(o => o.isDefault && o.enabled); pick(d >= 0 ? d : options.findIndex(o => o.enabled), box.querySelectorAll(".opt")[d >= 0 ? d : 0]); }
        };
        updaters.add(tick);
      }
    });
  }

  function ask(prompt, def) {
    return new Promise(resolve => {
      clearBubble();
      const c = el("form", "card", `<h2>${esc(prompt)}</h2><input type="text" id="name-input" maxlength="20" autocomplete="off" placeholder="${esc(def || "")}"><div class="row"><button class="btn" type="submit">Confirm</button></div>`);
      c.onsubmit = e => { e.preventDefault(); Audio2.sfx("pop"); c.remove(); resolve(c.querySelector("input").value); };
      ui.appendChild(c);
      setTimeout(() => { try { c.querySelector("input").focus(); } catch (e) {} }, 350);
    });
  }

  function toast(text, icon) {
    const t = el("div", "toast", `<span class="ic">${ICON[icon] || ICON.spark}</span><span>${esc(text)}</span>`);
    ui.appendChild(t); Audio2.sfx("notify");
    setTimeout(() => t.remove(), 2900);
  }
  function location(title, sub) {
    const t = el("div", "location", `<b>${esc(title)}</b>${sub ? `<small>${esc(sub)}</small>` : ""}`);
    ui.appendChild(t); setTimeout(() => t.remove(), 2300);
  }
  let shown = new Map();
  function showItem(name) {
    hideItem(name, true);
    const box = el("div", "showitem");
    const c = Art.item(name, 360); box.appendChild(c);
    ui.appendChild(box); shown.set(name, box); Audio2.sfx("whoosh");
  }
  function hideItem(name, instant) {
    const keys = name ? [name] : [...shown.keys()];
    for (const k of keys) { const b = shown.get(k); if (!b) continue; shown.delete(k); if (instant) b.remove(); else { b.animate([{ opacity: 1 }, { opacity: 0, transform: "translate(-50%,-50%) scale(.6)" }], { duration: 250, fill: "forwards" }); setTimeout(() => b.remove(), 260); } }
  }
  function fade(to, dur, color) {
    const f = fx.querySelector("#fade");
    if (color) f.style.background = color;
    const from = parseFloat(f.style.opacity || 0);
    return Clock.tween(dur, k => f.style.opacity = from + (to - from) * k);
  }
  async function flash(color, dur) {
    const f = fx.querySelector("#flash");
    f.style.background = color || "#fff";
    await Clock.tween(dur || 0.45, k => f.style.opacity = k < 0.15 ? k / 0.15 : 1 - (k - 0.15) / 0.85);
  }
  function clearAll() { clearBubble(); ui.innerHTML = ""; shown.clear(); cancelTaps(); }

  function tick(dt) { for (const u of [...updaters]) u(dt); if (bubble && bubble.update) bubble.update(); }

  function saveMode() { try { localStorage.setItem("vn_ui", JSON.stringify({ speed: mode.speed })); } catch (e) {} }

  return { init, el, esc, say, clearBubble, choice, ask, toast, location, showItem, hideItem, fade, flash, clearAll, tick, onTap, cancelTaps, kick, mode, saveMode, updaters, get frame() { return frame; }, get ui() { return ui; }, get mgLayer() { return mgLayer; }, get screens() { return screens; }, get hud() { return hud; } };
})();

// ===== Mini games: shared frame (intro, countdown, timer, results, retries) + 13 games =====
const Minigames = (() => {
  const games = {}, list = [];
  const el = UI.el, esc = UI.esc;
  const R = Math.random;
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  function reg(id, meta, fn) { games[id] = fn; list.push(Object.assign({ id }, meta)); }

  function confetti(root) {
    const c = document.createElement("canvas"); c.style.cssText = "position:absolute;inset:0;width:100%;height:100%;pointer-events:none";
    root.appendChild(c);
    const W = c.width = root.clientWidth * 2, H = c.height = root.clientHeight * 2, g = c.getContext("2d");
    const P = Array.from({ length: 120 }, () => ({ x: W / 2 + (R() - 0.5) * W * 0.3, y: H * 0.45, vx: (R() - 0.5) * W * 1.4, vy: -H * (0.6 + R() * 0.8), r: R() * 6, vr: (R() - 0.5) * 12, c: ["#ff5c8a", "#ffb547", "#3cc88f", "#5cc8ff", "#b07cff", "#fff"][Math.floor(R() * 6)], s: 6 + R() * 8 }));
    let last = performance.now(), life = 0;
    const step = now => {
      const dt = Math.min(0.05, (now - last) / 1000); last = now; life += dt;
      g.clearRect(0, 0, W, H);
      for (const p of P) { p.vy += H * 1.4 * dt; p.vx *= 0.99; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); g.restore(); }
      if (life < 3 && c.isConnected) requestAnimationFrame(step); else c.remove();
    };
    requestAnimationFrame(step);
  }

  async function run(id, params, data, env) {
    const fn = games[id];
    const meta = list.find(g => g.id === id);
    if (!fn) { UI.toast(`There is no mini game called "${id}"`); return { won: true, score: 0 }; }
    params = params || {};
    const P = {
      str: (k, d) => params[k] != null ? params[k] : d,
      num: (k, d) => { const v = Core.tryFloat(params[k]); return v == null ? d : v; },
      bool: (k, d) => params[k] == null ? d : !/^(no|false|off|0)$/i.test(params[k]),
    };
    const diff = { easy: 0.75, normal: 1, hard: 1.3 }[(params.difficulty || "normal").toLowerCase()] || 1;
    let retries = params.retries != null ? (/^yes|unlimited|true$/i.test(params.retries) ? Infinity : +params.retries || 0) : params.retry != null ? (/^(yes|true)$/i.test(params.retry) ? Infinity : 0) : 0;
    const title = P.str("title", meta.name);
    const instructions = P.str("instructions", meta.how);
    const prevMusic = Audio2.musicName;
    if (params.music) Audio2.music(params.music);
    const root = el("div", "mg" + (meta.light ? " light" : ""));
    UI.mgLayer.appendChild(root);
    const card = (h, body, buttons) => new Promise(res => {
      const c = el("div", "card", `<h2>${esc(h)}</h2>${body}<div class="row"></div>`);
      buttons.forEach(([label, val, cls]) => { const b = el("button", "btn " + (cls || ""), esc(label)); b.onclick = () => { Audio2.sfx("pop"); c.remove(); res(val); }; c.querySelector(".row").appendChild(b); });
      root.appendChild(c);
    });
    if (!P.bool("skipintro", false) && !meta.noIntro) {
      await card(title, `<div class="gi" style="width:3.4em;height:3.4em;border-radius:1em;margin:0 auto .8em;display:grid;place-items:center;color:#fff;background:${meta.color}">${ICON[meta.icon].replace("<svg", '<svg width="34" height="34"')}</div><p>${esc(instructions)}</p>`, [["Start", 1]]);
    }
    let result;
    for (let attempt = 0; ; attempt++) {
      root.querySelectorAll(".mg-hud,.mg-board").forEach(e => e.remove());
      const hud = el("div", "mg-hud", `<div class="top"><span class="title">${esc(title)}</span><span class="score"></span></div>`);
      const board = el("div", "mg-board");
      root.appendChild(board); root.appendChild(hud);
      const loops = new Set();
      let timeBar = null;
      const ctx = {
        root, board, hud, params, data: data || [], diff, env, P, num: P.num, str: P.str, bool: P.bool,
        sfx: n => Audio2.sfx(params[n + "sound"] || n),
        score(t) { hud.querySelector(".score").textContent = t; },
        loop(f) { const w = dt => f(dt); loops.add(w); UI.updaters.add(w); return () => { loops.delete(w); UI.updaters.delete(w); }; },
        timer(sec) {
          if (!sec) return { done: new Promise(() => {}), stop() {}, add() {}, left: () => Infinity, frac: () => 1 };
          if (!timeBar) { timeBar = el("div", "mg-time", "<i></i>"); hud.appendChild(timeBar); }
          const bar = timeBar.firstChild; let end = Clock.now + sec, stopped = false, resolve, lastTick = 99;
          const done = new Promise(r => resolve = r);
          const stop = ctx.loop(() => {
            if (stopped) return;
            const left = end - Clock.now;
            bar.style.transform = `scaleX(${Math.max(0, left / sec)})`;
            timeBar.classList.toggle("low", left < sec * 0.2);
            if (left < 5 && Math.ceil(left) < lastTick) { lastTick = Math.ceil(left); if (left > 0) Audio2.sfx("tick"); }
            if (left <= 0) { stopped = true; stop(); resolve("timeout"); }
          });
          return { done, stop() { stopped = true; stop(); }, add(s) { end += s; }, left: () => end - Clock.now, frac: () => Math.max(0, (end - Clock.now) / sec) };
        },
        feedback(text, color, y) {
          const f = el("div", "fb", esc(text)); f.style.color = color || "#fff"; f.style.top = (y == null ? 40 : y) + "%";
          root.appendChild(f); setTimeout(() => f.remove(), 750);
        },
        wait: s => Clock.wait(s),
      };
      if (!meta.noCountdown) {
        const cd = el("div", "count"); root.appendChild(cd);
        for (const n of ["3", "2", "1", "Go!"]) { cd.innerHTML = `<span>${n}</span>`; Audio2.sfx(n === "Go!" ? "go" : "count"); await Clock.wait(n === "Go!" ? 0.5 : 0.65); }
        cd.remove();
      }
      try { result = await fn(ctx); }
      finally { loops.forEach(w => UI.updaters.delete(w)); }
      if (meta.noResult) break;
      const won = !!result.won;
      Audio2.sfx(won ? "success" : "fail");
      if (won) confetti(root);
      const stars = won ? Math.max(1, Math.min(3, result.stars || 3)) : 0;
      const starHtml = `<div class="stars">${[0, 1, 2].map(i => `<svg viewBox="0 0 24 24" fill="currentColor" class="${i < stars ? "on" : ""}" style="animation-delay:${0.15 + i * 0.15}s"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>`).join("")}</div>`;
      const left = retries - attempt;
      const btns = [];
      if (!won && left > 0) btns.push(["Try again", "retry", "gold"]);
      btns.push([won ? "Continue" : (left > 0 ? "Give up" : "Continue"), "ok", !won && left > 0 ? "alt" : ""]);
      const ans = await card(won ? P.str("wintext", "You did it!") : P.str("losetext", "Not quite..."), starHtml + (result.detail ? `<p>${esc(result.detail)}</p>` : ""), btns);
      if (ans !== "retry") break;
    }
    root.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 250, fill: "forwards" });
    await Clock.wait(0.25);
    root.remove();
    if (params.music && prevMusic) Audio2.music(prevMusic);
    return { won: !!result.won, score: result.score || 0 };
  }

  const center = (ctx, html) => { const c = el("div", "mg-center", html || ""); ctx.board.appendChild(c); return c; };
  const pct = (a, b) => b ? a / b : 0;
  const starsFor = k => k >= 0.95 ? 3 : k >= 0.7 ? 2 : 1;

  // ---------- reaction ----------
  reg("qte", { name: "Quick reflexes", icon: "bolt", color: "#ff7a45", blurb: "Tap each target before its ring closes.", how: "Tap each target before the ring closes around it!" }, async ctx => {
    const count = ctx.num("count", 6), win = ctx.num("window", 1.2) / ctx.diff, need = ctx.num("need", Math.ceil(count * 0.75));
    let hits = 0; ctx.score(`0 / ${need}`);
    for (let i = 0; i < count; i++) {
      await ctx.wait(0.35 + R() * 0.3);
      const b = ctx.board, W = b.clientWidth, H = b.clientHeight, s = W * 0.2;
      const t = el("button", "", `<span style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff3b0,#ffb547);box-shadow:0 .3em 0 #c98618;display:grid;place-items:center;color:#7a4a00">${ICON.bolt.replace("<svg", '<svg width="40%"')}</span><span class="ring" style="position:absolute;inset:-60%;border-radius:50%;border:.3em solid #fff;pointer-events:none"></span>`);
      t.style.cssText = `position:absolute;width:${s}px;height:${s}px;left:${s * 0.6 + R() * (W - s * 2.2)}px;top:${H * 0.12 + R() * (H * 0.62)}px;animation:pop .25s both`;
      b.appendChild(t);

      });

      else { ctx.sfx("miss"); ctx.feedback("Missed", "#ff8a8a", 35); }
      ctx.score(`${hits} / ${need}`);
      t.remove();
    }
    return { won: hits >= need, score: hits, stars: starsFor(pct(hits, count)), detail: `${hits} of ${count} hit` };
  });

  reg("timing", { name: "Timing bar", icon: "target", color: "#ff5c8a", blurb: "Stop the marker in the zone. Pouring, lockpicking, archery.", how: "Tap when the marker is inside the green zone!" }, async ctx => {

  reg("mash", { name: "Button mash", icon: "hand", color: "#e0457b", blurb: "Tap fast to fill the meter. Arm wrestling, pushing doors.", how: "Tap the button as fast as you can to fill the meter!" }, async ctx => {

      ctx.loop(dt => { v = Math.max(0, v - decay * dt); bar.style.width = Math.min(100, v / taps * 100) + "%"; ctx.score(`${Math.round(v / taps * 100)}%`); });

  // ---------- puzzles ----------
  const FACES = [["heart", "#ff5c8a"], ["star", "#ffb547"], ["moon", "#7a6cff"], ["coffee", "#8a5a3c"], ["leaf", "#3cc88f"], ["diamond", "#5cc8ff"], ["flower", "#ff7aa1"], ["cake", "#e48a5a"], ["music2", "#b07cff"], ["gift", "#e0457b"], ["ring", "#d9a520"], ["letter", "#5a8fd9"]];
  reg("memory", { name: "Memory cards", icon: "cards", color: "#b07cff", blurb: "Flip two at a time to find every pair.", how: "Flip two cards at a time and find all the pairs!" }, async ctx => {
    const pairs = Math.min(12, ctx.num("pairs", 6)), time = ctx.num("time", 60) / ctx.diff;
    const faces = shuffle(FACES.slice()).slice(0, pairs);
    const deck = shuffle(faces.concat(faces).map((f, i) => ({ f, i })));
    const cols = pairs <= 6 ? 3 : 4;
    const c = center(ctx);
    const grid = el("div", "tile-grid"); grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0,1fr))`; grid.style.maxWidth = cols === 3 ? "78%" : "92%";
    c.appendChild(grid);
    let open = [], found = 0, busy = false, moves = 0;
    ctx.score(`0 / ${pairs}`);
    const T = ctx.timer(time);
    const res = await new Promise(resolve => {
      deck.forEach(d => {
        const back = ArtStore.get("mg/memory/card_back");
        const m = el("button", "mcard", `<div class="in"><div class="b"${back ? ` style="background:url(${back.src}) center/cover"` : ""}></div><div class="f" style="color:${d.f[1]}">${ICON[d.f[0]]}</div></div>`);
        m.onclick = async () => {
          if (busy || m.classList.contains("up") || m.classList.contains("got")) return;
          m.classList.add("up"); ctx.sfx("flip"); open.push([m, d]);
          if (open.length === 2) {
            busy = true; moves++;
            const [[a, da], [b, db]] = open; open = [];
            if (da.f[0] === db.f[0]) { await ctx.wait(0.3); a.classList.add("got"); b.classList.add("got"); ctx.sfx("match"); found++; ctx.score(`${found} / ${pairs}`); if (found === pairs) resolve("win"); }
            else { await ctx.wait(0.7); a.classList.remove("up"); b.classList.remove("up"); }
            busy = false;
          }
        };
        grid.appendChild(m);
      });
      T.done.then(() => resolve("time"));
    });
    T.stop();
    return { won: res === "win", score: found, stars: res === "win" ? starsFor(T.frac() + 0.4) : 0, detail: res === "win" ? `${moves} moves` : `${found} of ${pairs} pairs` };
  });

  function sceneImage(ctx, size) {
    const st = ctx.env.stage, name = ctx.str("image", null) || st.bgName || "INT. COFFEE SHOP - DAY";
    const src = Art.background(name, 540, 960);
    const c = document.createElement("canvas"); c.width = c.height = size;
    c.getContext("2d").drawImage(src, 0, (960 - 540) * 0.35, 540, 540, 0, 0, size, size);
    return c.toDataURL("image/jpeg", 0.85);
  }
  reg("slide", { name: "Sliding puzzle", icon: "puzzle", color: "#3fa69a", blurb: "Rebuild a scrambled picture, tile by tile.", how: "Slide the tiles back into place to rebuild the picture." }, async ctx => {
    const n = Math.max(2, Math.min(5, ctx.num("size", 3))), time = ctx.num("time", 150) / ctx.diff;
    const img = sceneImage(ctx, 600);
    const c = center(ctx, `<div style="font-size:.85em;opacity:.85">Tap a tile next to the gap</div>`);
    const box = el("div"); box.style.cssText = "position:relative;width:86%;aspect-ratio:1;max-width:100%;border-radius:.8em;overflow:hidden;background:rgba(255,255,255,.12);box-shadow:0 .5em 1.5em rgba(0,0,0,.4)";
    c.appendChild(box);
    let pos = [...Array(n * n).keys()]; // pos[tile] = cell
    let empty = n * n - 1;
    for (let k = 0; k < 60 * n; k++) {
      const er = Math.floor(empty / n), ec = empty % n;
      const nb = [[er - 1, ec], [er + 1, ec], [er, ec - 1], [er, ec + 1]].filter(([r, cc]) => r >= 0 && r < n && cc >= 0 && cc < n).map(([r, cc]) => r * n + cc);
      const cell = nb[Math.floor(R() * nb.length)], t = pos.indexOf(cell);
      pos[t] = empty; empty = cell;
    }
    const tiles = [];
    let moves = 0;
    const place = () => tiles.forEach((t, i) => { const cell = pos[i]; t.style.transform = `translate(${(cell % n) * 100}%, ${Math.floor(cell / n) * 100}%)`; });
    const solved = () => pos.every((p, i) => i === n * n - 1 || p === i);
    ctx.score("0 moves");
    const T = ctx.timer(time);
    const res = await new Promise(resolve => {
      for (let i = 0; i < n * n - 1; i++) {
        const t = el("button", "", `<span style="position:absolute;right:.3em;bottom:.2em;font-family:var(--font-title);font-size:.8em;color:#fff;text-shadow:0 .1em .2em rgba(0,0,0,.7)">${i + 1}</span>`);
        t.style.cssText = `position:absolute;left:0;top:0;width:${100 / n}%;height:${100 / n}%;background-image:url(${img});background-size:${n * 100}% ${n * 100}%;background-position:${(i % n) / (n - 1) * 100}% ${Math.floor(i / n) / (n - 1) * 100}%;transition:transform .14s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)`;
        t.onclick = () => {
          const cell = pos[i], r = Math.floor(cell / n), cc = cell % n, er = Math.floor(empty / n), ec = empty % n;
          if (Math.abs(r - er) + Math.abs(cc - ec) !== 1) { ctx.sfx("miss"); return; }
          pos[i] = empty; empty = cell; moves++; ctx.sfx("flip"); ctx.score(`${moves} moves`); place();
          if (solved()) resolve("win");
        };
        tiles.push(t); box.appendChild(t);
      }
      place();
      T.done.then(() => resolve("time"));
    });
    T.stop();
    return { won: res === "win", score: moves, stars: res === "win" ? starsFor(T.frac() + 0.35) : 0, detail: `${moves} moves` };
  });

  reg("scramble", { name: "Word scramble", icon: "abc", color: "#e48a5a", blurb: "Unscramble the letters to spell the word.", how: "Tap the letters in order to spell the hidden word." }, async ctx => {

    const c = center(ctx, `${hint ? `<div style="text-align:center;font-size:.95em;opacity:.9">${esc(hint)}</div>` : ""}<div class="slots" style="display:flex;gap:.35em;flex-wrap:wrap;justify-content:center"></div><div class="pool" style="display:flex;gap:.35em;flex-wrap:wrap;justify-content:center;margin-top:1em"></div>`);
    const slotsEl = c.querySelector(".slots"), poolEl = c.querySelector(".pool");

        }

  // ---------- mind ----------
  reg("quiz", { name: "Quiz", icon: "quiz", color: "#5cc8ff", blurb: "Answer questions written right in the story.", how: "Pick the right answer for each question.", noCountdown: true }, async ctx => {
    const qs = []; let cur = null;
    for (const raw of ctx.data) {
      const l = raw.trim();
      if (/^q\s*:/i.test(l)) { cur = { q: l.replace(/^q\s*:\s*/i, ""), a: [] }; qs.push(cur); }
      else if (cur && /^[*-]/.test(l)) cur.a.push({ t: l.slice(1).trim(), ok: l[0] === "*" });
    }
    if (!qs.length) qs.push({ q: "What does this engine read?", a: [{ t: "Plain-text stories", ok: true }, { t: "Spreadsheets", ok: false }, { t: "Videos", ok: false }] });
    const order = ctx.bool("shuffle", true) ? shuffle(qs.slice()) : qs;
    const pass = ctx.num("pass", Math.ceil(qs.length * 0.6)), per = ctx.num("time", 0);
    let right = 0;
    for (let i = 0; i < order.length; i++) {
      const q = order[i];
      ctx.board.innerHTML = "";
      ctx.score(`${i + 1} / ${order.length}`);
      const c = center(ctx, `<div class="card" style="position:static;transform:none;width:100%;animation:pop .3s both"><div class="eyebrow" style="color:#8a7a90;margin-bottom:.4em">Question ${i + 1}</div><h2 style="font-size:1.2em">${esc(q.q)}</h2><div class="ans" style="display:flex;flex-direction:column;gap:.5em"></div></div>`);
      const ans = c.querySelector(".ans");
      const answers = ctx.bool("shuffleanswers", true) ? shuffle(q.a.slice()) : q.a;
      const T = per ? ctx.timer(per) : null;

  reg("keypad", { name: "Code keypad", icon: "keypad", color: "#46b39d", blurb: "Enter the code to open a safe, phone or door.", how: "Enter the right code. Look for clues!" }, async ctx => {
    const code = String(ctx.str("code", "1234")), tries0 = ctx.num("tries", 3), hint = ctx.str("hint", null), time = ctx.num("time", 0), auto = ctx.bool("autosubmit", true);

  reg("sequence", { name: "Follow the pattern", icon: "simon", color: "#ff9f1c", blurb: "Watch the pads light up, then repeat.", how: "Watch the pattern, then tap the pads in the same order." }, async ctx => {
    const length = ctx.num("length", 5), pads = Math.max(3, Math.min(6, ctx.num("pads", 4))), start = ctx.num("start", 2);
    const cols = ["#ff5c8a", "#3cc88f", "#5cc8ff", "#ffb547", "#b07cff", "#ff7a45"];

  // ---------- action ----------
  reg("catch", { name: "Catch", icon: "basket", color: "#3cc88f", blurb: "Drag the basket; catch the good, dodge the bad.", how: "Drag the basket to catch the good things. Avoid the bad ones!" }, async ctx => {
    const need = ctx.num("need", 12), time = ctx.num("time", 25), speed = ctx.num("speed", 1) * ctx.diff, bad = ctx.num("bad", 0.3);

  reg("rhythm", { name: "Rhythm", icon: "note", color: "#ff5c8a", blurb: "Tap the notes as they cross the line.", how: "Tap each lane's button as the notes cross the line!" }, async ctx => {
    const bpm = ctx.num("bpm", 110), count = ctx.num("notes", 20), lanes = Math.max(2, Math.min(4, ctx.num("lanes", 3))), need = ctx.num("need", 70), travel = ctx.num("travel", 1.4) / ctx.diff;

    let hits = 0, judged = 0, lastBeat = -1;

    });
    await new Promise(resolve => {

        for (const n of notes) {

          if (n.el) n.el.style.transform = `translateY(${k * lineY}px)`;
          if (!n.state && now - n.time > 0.2) { judge(n, false); ctx.feedback("Miss", "#ff8a8a", 55); }
          if (n.el && k > 1.25) { n.el.remove(); n.el = null; }
        }
        if (judged >= notes.length && now > notes[notes.length - 1].time + 0.5) resolve();
      });
    });
    const acc = Math.round(hits / notes.length * 100);
